# SkyFire 5.4.8 + mod-playerbots. See README.md.
#
#   cp .env.example .env               # optional, to change defaults
#   docker compose build
#   docker compose run --rm extractor  # once, needs WOW_CLIENT_DIR
#   docker compose up -d
#   docker attach mop-worldserver      # GM console (detach: Ctrl-p Ctrl-q)
#
# The image is built from SkyFire_548's Dockerfile with mod-playerbots added
# as an out-of-tree module. Both come from git at the refs below; for local
# checkouts, add docker-compose.dev.yml (see README.md).

x-skyfire-image: &skyfire-image
  image: mop-stack:${MOP_IMAGE_TAG:-latest}
  build:
    context: "${SKYFIRE_GIT:-https://github.com/gacou54/SkyFire_548.git}#${SKYFIRE_REF:-docker-compose}"
    additional_contexts:
      extra_modules: "${PLAYERBOTS_GIT:-https://github.com/gacou54/mod-playerbots.git}#${PLAYERBOTS_REF:-main}"
    args:
      EXTRA_MODULE_NAME: mod-playerbots
      BUILD_TYPE: ${SKYFIRE_BUILD_TYPE:-Release}
      BUILD_JOBS: ${SKYFIRE_BUILD_JOBS:-}
      SKYFIRE_UID: ${SKYFIRE_UID:-1000}
      SKYFIRE_GID: ${SKYFIRE_GID:-1000}

x-db-env: &db-env
  DB_HOST: db
  DB_PORT: "3306"
  DB_USER: ${DB_USER:-skyfire}
  DB_PASSWORD: ${DB_PASSWORD:-skyfire}

services:
  db:
    image: mysql:8.4
    container_name: mop-db
    restart: unless-stopped
    command:
      - --max-allowed-packet=1G
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL_SIZE:-1G}
      - --innodb-log-file-size=512M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-skyfire-root}
      MYSQL_USER: ${DB_USER:-skyfire}
      MYSQL_PASSWORD: ${DB_PASSWORD:-skyfire}
    volumes:
      - db-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  authserver:
    <<: *skyfire-image
    container_name: mop-authserver
    command: ["authserver"]
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      SFCONF_LoginDatabase__AutoSetup: "1"
    volumes:
      - logs:/opt/skyfire/logs
    ports:
      - "${AUTH_PORT:-3724}:3724"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3724"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 120s

  worldserver:
    <<: *skyfire-image
    container_name: mop-worldserver
    command: ["worldserver"]
    restart: unless-stopped
    init: true
    # Keep stdin open: the worldserver console stops the server on EOF.
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
      authserver:
        condition: service_healthy
    # Any SFCONF_* line in .env reaches the worldserver config (worldserver.conf
    # or playerbots.conf). Values under "environment" below take precedence.
    env_file:
      - path: .env
        required: false
    environment:
      <<: *db-env
      # Must match the published port; realmlist.port is set to it.
      WORLD_PORT: ${WORLD_PORT:-8085}
      # Address the client connects to for the realm. 127.0.0.1 works when the
      # client runs on this machine; use the host's LAN/public IP otherwise.
      REALM_ADDRESS: ${REALM_ADDRESS:-127.0.0.1}
      REALM_NAME: ${REALM_NAME:-MoP Playerbots}
      # Downloaded into the dbdump volume only if the world DB is empty.
      WORLD_DB_URL: ${WORLD_DB_URL:-https://github.com/ProjectSkyfire/SkyFire_548/releases/download/sf_db_27/SFDB_full_548_27.001_2026_011_03_Release.zip}
      SFCONF_WorldDatabase__AutoSetup: "1"
      SFCONF_CharacterDatabase__AutoSetup: "1"
      SFCONF_WorldDatabase__ImportPendingUpdates: ${IMPORT_PENDING_UPDATES:-0}
      SFCONF_CharacterDatabase__ImportPendingUpdates: ${IMPORT_PENDING_UPDATES:-0}
      # Remote access for automation (bound to 127.0.0.1 on the host below).
      SFCONF_Ra__Enable: ${RA_ENABLE:-0}
      SFCONF_SOAP__Enabled: ${SOAP_ENABLE:-0}
      SFCONF_SOAP__IP: "0.0.0.0"
      # Playerbots (playerbots.conf).
      SFCONF_Playerbots__Enable: ${PLAYERBOTS_ENABLE:-1}
      SFCONF_Playerbots__RandomBots__Enable: ${PLAYERBOTS_RANDOM_BOTS:-1}
      SFCONF_Playerbots__RandomBots__MaxBots: ${PLAYERBOTS_MAX_BOTS:-20}
      SFCONF_Playerbots__AutoCreate__OnStartup: ${PLAYERBOTS_AUTOCREATE:-1}
      SFCONF_Playerbots__AutoCreate__AccountCount: ${PLAYERBOTS_ACCOUNTS:-20}
      SFCONF_Playerbots__AutoCreate__AccountPassword: ${PLAYERBOTS_ACCOUNT_PASSWORD:-password}
      SFCONF_Playerbots__AutoCreate__MinLevel: ${PLAYERBOTS_MIN_LEVEL:-90}
      SFCONF_Playerbots__AutoCreate__MaxLevel: ${PLAYERBOTS_MAX_LEVEL:-90}
    volumes:
      - ${SKYFIRE_DATA_DIR:-./data}:/opt/skyfire/data:ro
      - dbdump:/opt/skyfire/dbdump
      - logs:/opt/skyfire/logs
    ports:
      - "${WORLD_PORT:-8085}:${WORLD_PORT:-8085}"
      - "127.0.0.1:${RA_PORT:-3443}:3443"
      - "127.0.0.1:${SOAP_PORT:-7878}:7878"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/$$WORLD_PORT"]
      interval: 15s
      timeout: 3s
      retries: 8
      # First start imports the world database, which takes a while.
      start_period: 3600s

  # One-shot client data extraction: docker compose run --rm extractor [maps] [vmaps] [mmaps]
  extractor:
    <<: *skyfire-image
    profiles: ["tools"]
    entrypoint: ["skyfire-extract-data"]
    command: []
    volumes:
      - ${WOW_CLIENT_DIR:-./client}:/client:ro
      - ${SKYFIRE_DATA_DIR:-./data}:/opt/skyfire/data

volumes:
  db-data:
  dbdump:
  logs:
